<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Валютный двор — калькулятор RUB · USD · THB</title>
    <meta
      name="description"
      content="Калькулятор валют для рубля, доллара США и тайского бата. Кросс-курсы пересчитываются автоматически через базовый USD."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c2e24'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23f0b654' stroke-width='4'/%3E%3Cpath d='M27 22v20M27 27h8a5.5 5.5 0 0 1 0 11h-8' fill='none' stroke='%23f0b654' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <!--
      ВАЖНО: шрифты подключаются НЕБЛОКИРУЮЩИМ способом (media="print" → "all").
      Обычный <link rel="stylesheet"> на fonts.googleapis.com останавливает
      отрисовку всей страницы, пока Google отвечает, — при недоступности
      сервиса пользователь видел бы пустой белый экран.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <style>
      /* Мгновенная отрисовка: фон и загрузчик видны ещё до загрузки JS и шрифтов */
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        background-color: #f1f5ef;
        color: #16241e;
        font-family: "Golos Text", "Segoe UI", Tahoma, Verdana, sans-serif;
      }
      #boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        min-height: 100vh;
      }
      #boot svg {
        animation: bootSpin 1.1s linear infinite;
      }
      #boot span {
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: #5d6d64;
      }
      @keyframes bootSpin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Запасной загрузчик: показывается, пока React монтирует приложение -->
      <div id="boot">
        <svg width="42" height="42" viewBox="0 0 42 42" fill="none" aria-hidden="true">
          <circle cx="21" cy="21" r="17" stroke="#dcebe2" stroke-width="5" />
          <path d="M21 4a17 17 0 0 1 17 17" stroke="#e5a333" stroke-width="5" stroke-linecap="round" />
        </svg>
        <span>Загружаем калькулятор…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
